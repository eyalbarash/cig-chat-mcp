name: Spec drift

# Learn that cig.chat shipped new endpoints before a customer reports it.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Refresh the vendored spec
        run: npm run spec:pull

      - name: Summarise any drift
        id: drift
        run: |
          if git diff --quiet -- spec/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo 'summary<<EOF'
            echo 'The live cig.chat OpenAPI document no longer matches `spec/openapi.json`.'
            echo
            echo 'To adopt it: `npm run spec:pull && npm run gen && npm test`, then review the'
            echo 'diff in `src/generated/` — new operations become tools automatically, but new'
            echo 'send/broadcast/destructive endpoints need a tier in `spec/overrides.ts`.'
            echo
            echo '```diff'
            git diff --stat -- spec/openapi.json
            echo '```'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - if: steps.drift.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream API spec has changed';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            if (open.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body: process.env.SUMMARY,
            });
        env:
          SUMMARY: ${{ steps.drift.outputs.summary }}
